<!--
  Página de inicio de sesión.
  Contiene el formulario para acceder a la cuenta de VitaVet.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inicio de sesión de VitaVet, clínica veterinaria y bienestar animal."
    />
    <title>Iniciar sesión | VitaVet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <!-- Área visual de bienvenida y mensaje institucional. -->
      <section class="login-visual" aria-label="VitaVet, bienestar animal">
        <!-- Recurso local reservado para la fotografía definida en el diseño. -->
        <img
          class="login-visual-image"
          src="../assets/images/mascotas/golden-retriever-interior.jpg"
          alt="Golden Retriever en un ambiente interior luminoso"
        />
        <p class="login-visual-caption">
          Cuidado excepcional para cada etapa de su vida.
        </p>
      </section>

      <!-- Panel que contiene el acceso y los datos del usuario. -->
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-content">
          <header class="login-brand">
            <span class="login-brand-name">VitaVet</span>
            <span class="login-brand-tagline">Clínica veterinaria &amp; bienestar animal</span>
          </header>

          <div class="page-header">
            <h1 id="login-title" class="login-heading">Bienvenido a VitaVet</h1>
            <p class="login-intro">Tu mascota merece un cuidado excepcional.</p>
          </div>

          <!-- Formulario de acceso mediante correo y contraseña. -->
          <form id="loginForm" class="login-form">
            <div class="form-group">
              <label class="form-label" for="email">Correo electrónico</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                placeholder="correo@ejemplo.com"
                autocomplete="email"
                aria-describedby="loginFormMessage"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Contraseña</label>
              <div class="login-password-field">
                <input
                  class="form-control"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  aria-describedby="loginFormMessage"
                  required
                />
                <button
                  class="password-toggle"
                  id="passwordToggle"
                  type="button"
                  aria-label="Mostrar contraseña"
                  aria-controls="password"
                  aria-pressed="false"
                >
                  <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M12 5c-5.2 0-9.2 3.1-11 7 1.8 3.9 5.8 7 11 7s9.2-3.1 11-7c-1.8-3.9-5.8-7-11-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5.5Z" />
                  </svg>
                </button>
              </div>
            </div>

            <a class="login-recovery" href="#recovery">¿Olvidaste tu contraseña?</a>

            <p id="loginFormMessage" class="login-form-message" role="alert" aria-live="polite"></p>

            <button class="btn btn-primary login-submit" type="submit">Iniciar sesión</button>
          </form>

          <p class="login-signup">
            ¿No tienes una cuenta?
            <a class="login-signup-link" href="registro.html">Crear cuenta</a>
          </p>
        </div>
      </section>
    </main>

    <script src="../js/login.js" defer></script>
  </body>
</html>
