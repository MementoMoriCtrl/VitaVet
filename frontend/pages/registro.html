<!--
  Página de registro de usuario.
  Solicita los datos personales, de contacto y de acceso a VitaVet.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crea tu cuenta en VitaVet, clínica veterinaria y bienestar animal."
    />
    <title>Crear cuenta | VitaVet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <!-- Área visual compartida por las pantallas de autenticación. -->
      <section class="login-visual" aria-label="VitaVet, bienestar animal">
        <img
          class="login-visual-image"
          src="../assets/images/mascotas/golden-retriever-interior.jpg"
          alt="Golden Retriever en un ambiente interior luminoso"
        />
        <p class="login-visual-caption">
          Cuidado excepcional para cada etapa de su vida.
        </p>
      </section>

      <!-- Panel que contiene los datos necesarios para crear la cuenta. -->
      <section class="login-panel" aria-labelledby="register-title">
        <div class="login-content register-content">
          <header class="login-brand">
            <span class="login-brand-name">VitaVet</span>
            <span class="login-brand-tagline">Clínica veterinaria &amp; bienestar animal</span>
          </header>

          <div class="page-header">
            <h1 id="register-title" class="login-heading">Crea tu cuenta</h1>
            <p class="login-intro">
              Forma parte de VitaVet y gestiona el cuidado de tus mascotas desde un solo lugar.
            </p>
          </div>

          <!-- Formulario de registro con datos personales, contacto,
            contraseñas y aceptación de términos. -->
          <form id="registerForm" class="login-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="fullName">Nombre completo</label>
              <input
                class="form-control"
                id="fullName"
                name="fullName"
                type="text"
                placeholder="Sofía Perez"
                autocomplete="name"
                aria-describedby="registerFormMessage"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Correo electrónico</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                placeholder="sofia.perez@email.com"
                autocomplete="email"
                aria-describedby="registerFormMessage"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Teléfono</label>
              <input
                class="form-control"
                id="phone"
                name="phone"
                type="tel"
                placeholder="+51 999 999 999"
                autocomplete="tel"
                aria-describedby="registerFormMessage"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Contraseña</label>
              <div class="login-password-field">
                <input
                  class="form-control"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  aria-describedby="registerFormMessage"
                  minlength="8"
                  required
                />
                <button
                  class="password-toggle"
                  id="passwordToggle"
                  type="button"
                  aria-label="Mostrar contraseña"
                  aria-controls="password"
                  aria-pressed="false"
                >
                  <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M12 5c-5.2 0-9.2 3.1-11 7 1.8 3.9 5.8 7 11 7s9.2-3.1 11-7c-1.8-3.9-5.8-7-11-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5.5Z" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="passwordConfirmation">Confirmar contraseña</label>
              <div class="login-password-field">
                <input
                  class="form-control"
                  id="passwordConfirmation"
                  name="passwordConfirmation"
                  type="password"
                  autocomplete="new-password"
                  aria-describedby="registerFormMessage"
                  minlength="8"
                  required
                />
                <button
                  class="password-toggle"
                  id="passwordConfirmationToggle"
                  type="button"
                  aria-label="Mostrar confirmación de contraseña"
                  aria-controls="passwordConfirmation"
                  aria-pressed="false"
                >
                  <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M12 5c-5.2 0-9.2 3.1-11 7 1.8 3.9 5.8 7 11 7s9.2-3.1 11-7c-1.8-3.9-5.8-7-11-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5.5Z" />
                  </svg>
                </button>
              </div>
            </div>

            <label class="form-check register-terms" for="terms">
              <input
                id="terms"
                name="terms"
                type="checkbox"
                aria-describedby="registerFormMessage"
                required
              />
              <span>
                Al crear una cuenta acepto los
                <a class="register-terms-link" href="#terms">Términos y condiciones</a>
                y la
                <a class="register-terms-link" href="#privacy">Política de privacidad</a>.
              </span>
            </label>

            <p id="registerFormMessage" class="login-form-message" role="alert" aria-live="polite"></p>

            <button class="btn btn-primary login-submit" type="submit">Crear cuenta</button>
          </form>

          <p class="login-signup">
            ¿Ya tienes una cuenta?
            <a class="login-signup-link" href="login.html">Iniciar sesión</a>
          </p>
        </div>
      </section>
    </main>

    <script src="../js/registro.js" defer></script>
  </body>
</html>
