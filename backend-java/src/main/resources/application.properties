
spring.application.name=VitaVet Backend

spring.datasource.url=jdbc:mysql://localhost:3306/vitavet
spring.datasource.username=root
spring.datasource.password=1992

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Clave local de desarrollo. En otros entornos, definir JWT_SECRET con al menos 32 bytes.
jwt.secret=${JWT_SECRET:VitaVet-development-only-secret-replace-with-env-before-deploy-2026}
jwt.expiration-seconds=3600
